name: Trigger docs.assertj.dev build

on:
  workflow_call:
    secrets:
      client-id:
        description: Client ID of the AssertJ Builds GitHub App
        required: true
      private-key:
        description: Private key of the AssertJ Builds GitHub App
        required: true

permissions: {}

jobs:

  trigger:

    name: Trigger build
    runs-on: ubuntu-latest

    steps:
      - name: Create token for docs.assertj.dev
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.private-key }}
          owner: assertj
          repositories: docs.assertj.dev
          permission-actions: write
      - name: Trigger build
        run: gh workflow run build.yml --repo assertj/docs.assertj.dev --ref main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
